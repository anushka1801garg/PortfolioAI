<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#0f111a" />
      <stop offset="100%" stop-color="#18132b" />
    </linearGradient>
    <radialGradient id="glow-purple" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 200) rotate(90) scale(400)">
      <stop stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="1" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-blue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(900 400) rotate(90) scale(450)">
      <stop stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="1" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="text-gradient" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow-purple)" />
  <rect width="1200" height="630" fill="url(#glow-blue)" />

  <!-- Grid overlay -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="550" x2="1200" y2="550" />
  </g>

  <!-- Decorative Badge -->
  <g transform="translate(100, 110)">
    <rect width="260" height="42" rx="21" fill="#6366f1" fill-opacity="0.15" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="24" cy="21" r="6" fill="#a855f7" />
    <text x="40" y="27" fill="#e0e7ff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="1">AWARD-WINNING AI SUITE</text>
  </g>

  <!-- Brand Title -->
  <text x="100" y="235" fill="url(#text-gradient)" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" letter-spacing="-1.5">
    Portfolio<tspan fill="#a855f7">AI</tspan>
  </text>

  <!-- Subtitle -->
  <text x="100" y="305" fill="#f43f5e" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" letter-spacing="0.5">
    Next-Gen Developer &amp; Executive Portfolios
  </text>

  <!-- Description -->
  <text x="100" y="360" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">
    Transform your resume into a live, interactive developer portfolio in 30 seconds.
  </text>
  <text x="100" y="395" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">
    Featuring real-time AI styling, ATS scoring, and 1-click global edge CDN deployment.
  </text>

  <!-- Highlights Pills -->
  <g transform="translate(100, 460)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="46" rx="14" fill="#1e1b4b" fill-opacity="0.8" stroke="#4338ca" stroke-width="1" />
      <text x="90" y="29" fill="#c7d2fe" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle">⚡ 30s AI Build</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(200, 0)">
      <rect width="210" height="46" rx="14" fill="#1e1b4b" fill-opacity="0.8" stroke="#4338ca" stroke-width="1" />
      <text x="105" y="29" fill="#c7d2fe" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle">🎯 Nemotron ATS Score</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(430, 0)">
      <rect width="200" height="46" rx="14" fill="#1e1b4b" fill-opacity="0.8" stroke="#4338ca" stroke-width="1" />
      <text x="100" y="29" fill="#c7d2fe" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle">🌐 1-Click Netlify / Vercel</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(650, 0)">
      <rect width="180" height="46" rx="14" fill="#1e1b4b" fill-opacity="0.8" stroke="#4338ca" stroke-width="1" />
      <text x="90" y="29" fill="#c7d2fe" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle">🐙 GitHub Sync</text>
    </g>
  </g>

  <!-- URL watermark -->
  <text x="1100" y="580" fill="#64748b" font-family="system-ui, -apple-system, monospace" font-size="16" font-weight="500" text-anchor="end">
    portfolioai.app
  </text>
</svg>

